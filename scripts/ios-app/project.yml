# XcodeGen spec — generates Yijing.xcodeproj from this text file (keeps the repo
# free of a binary .xcodeproj, regenerable, diff-friendly; fits the lean ethos).
#
#   brew install xcodegen
#   scripts/ios-app/build-ios-app.sh        # stages web assets + runs xcodegen + builds
#
# The web app (web/, data/, sw.js) is staged into WebContent/ by the build script
# and embedded as folder references so the bundle root contains web/ and data/
# siblings — exactly the layout the macOS app serves (app.js's ../data/ resolves).

name: Yijing
options:
  bundleIdPrefix: page.codeberg.jkaindl
  deploymentTarget:
    iOS: "17.0"
    # Mac Catalyst minimum. The app degrades gracefully without an on-device
    # model (BYO endpoint / setup card), so a broad floor is fine; Apple
    # Foundation Models is gated to macOS 26 at runtime (SystemLanguageModel
    # availability), not by this target.
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Signing is supplied at build time (env / xcodebuild flags), mirroring the
    # macOS build's opt-in signing. Leave DEVELOPMENT_TEAM empty here.
    CODE_SIGN_STYLE: Automatic

targets:
  Yijing:
    type: application
    platform: iOS
    # Full universal: iPhone + iPad (iOS) AND Mac via Mac Catalyst. Long-term
    # this Catalyst Mac build supersedes the legacy AppKit app in scripts/macos-app/.
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Sources
      # Web app embedded as folder references → land at the bundle resource root
      # as web/ and data/ siblings + sw.js (staged by build-ios-app.sh).
      - path: WebContent/web
        type: folder
      - path: WebContent/data
        type: folder
      - path: WebContent/sw.js
      - path: Resources/Acknowledgements.md
      # App icon — single 1024px source (no alpha); Xcode derives all sizes.
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.codeberg.jkaindl.Yijing
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Yijing.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (inert on Mac Catalyst)
        GENERATE_INFOPLIST_FILE: NO
        # Keep ONE bundle id across iOS and Mac Catalyst (don't prefix the Mac
        # build with "maccatalyst.") — it's the same product, one App Store record.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    # llama.cpp engine — uncomment after adding the official package (or a local
    # XCFramework binaryTarget). Until then, MockEngine is used (canImport(llama)
    # is false) and the app builds + runs with the web shell + mock AI.
    # dependencies:
    #   - package: llama
    # packages are declared in the `packages:` block below.

# packages:
#   llama:
#     url: https://github.com/ggml-org/llama.cpp
#     # pin a tag you have validated on-device:
#     exactVersion: "bXXXX"
