# XcodeGen spec — generates Yijing.xcodeproj from this text file (keeps the repo
# free of a binary .xcodeproj, regenerable, diff-friendly; fits the lean ethos).
#
#   brew install xcodegen
#   scripts/ios-app/build-ios-app.sh        # stages web assets + runs xcodegen + builds
#
# The web app (web/, data/, sw.js) is staged into WebContent/ by the build script
# and embedded as folder references so the bundle root contains web/ and data/
# siblings — exactly the layout the macOS app serves (app.js's ../data/ resolves).

name: Yijing
options:
  bundleIdPrefix: page.codeberg.jkaindl
  deploymentTarget:
    iOS: "17.0"
    # Mac Catalyst minimum. The app degrades gracefully without an on-device
    # model (BYO endpoint / setup card), so a broad floor is fine; Apple
    # Foundation Models is gated to macOS 26 at runtime (SystemLanguageModel
    # availability), not by this target.
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    # Signing is supplied at build time (env / xcodebuild flags), mirroring the
    # macOS build's opt-in signing. Leave DEVELOPMENT_TEAM empty here.
    CODE_SIGN_STYLE: Automatic

targets:
  Yijing:
    type: application
    platform: iOS
    # Full universal: iPhone + iPad (iOS) AND Mac via Mac Catalyst. Long-term
    # this Catalyst Mac build supersedes the legacy AppKit app in scripts/macos-app/.
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Sources
      # Web app embedded as folder references → land at the bundle resource root
      # as web/ and data/ siblings + sw.js (staged by build-ios-app.sh).
      - path: WebContent/web
        type: folder
      - path: WebContent/data
        type: folder
      - path: WebContent/sw.js
      - path: Resources/Acknowledgements.md
      # Privacy manifest — lands at the bundle resource root as PrivacyInfo.xcprivacy.
      - path: Resources/PrivacyInfo.xcprivacy
      # App icon — single 1024px source (no alpha); Xcode derives all sizes.
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.codeberg.jkaindl.Yijing
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Yijing.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (inert on Mac Catalyst)
        GENERATE_INFOPLIST_FILE: NO
        # Keep ONE bundle id across iOS and Mac Catalyst (don't prefix the Mac
        # build with "maccatalyst.") — it's the same product, one App Store record.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    dependencies:
      - package: OracleKit
      - target: YijingWidgets   # embedded WidgetKit extension
      - target: YijingWatch     # embedded watchOS app (installs to the paired Watch)
        embed: true
        # Only embed on iOS (device/simulator) — a Mac Catalyst app must NOT embed
        # a watchOS app (xcodebuild: "WatchKitAppInvalidUIDeviceFamily" / embedded
        # watchOS content not allowed in a macOS app). Macs have no paired watch via
        # the Mac build anyway. Keeps the watch in the iOS device/archive build.
        destinationFilters: [iOS]
    # llama.cpp engine — uncomment after adding the package; MockEngine until then.
    #   - package: llama

  # Daily-hexagram widget (iPhone/iPad/Mac). Shares OracleKit; bundles only the
  # slim widget-hexagrams.json slice. Tap → app via the yijing:// deep link.
  YijingWidgets:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Shared/BrandColors.swift
      - path: Widgets/HexFigureView.swift
      - path: Widgets/DailyHexWidget.swift
      - path: Widgets/WidgetBundle.swift
      - path: Widgets/PrivacyInfo.xcprivacy
      # slim slice (staged into WebContent/data by build-ios-app.sh before xcodegen);
      # the SlimData loader lives in OracleKit (shared with the watch complication).
      - path: WebContent/data/widget-hexagrams.json
    dependencies:
      - package: OracleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.codeberg.jkaindl.Yijing.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Yijing.widgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO

  # watchOS app: Heute (daily hexagram) + Werfen (full cast). Bundles the full
  # hexagram JSON. Embedded in the iOS app (installs to the paired Apple Watch).
  YijingWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Shared/BrandColors.swift
      - path: Watch/YijingWatchApp.swift
      - path: Watch/HexReadingView.swift
      - path: Watch/ReferenceView.swift
      - path: Watch/TodayView.swift
      - path: Watch/CastView.swift
      - path: Watch/WatchHexFigure.swift
      - path: Watch/PrivacyInfo.xcprivacy
      # App icon — single 1024px source (no alpha), same brand mark as the phone
      # app; watchOS derives its sizes. Required for a valid App Store archive.
      - path: Watch/Assets.xcassets
      # full texts for the on-wrist readings (staged into WebContent/data)
      - path: WebContent/data/hexagrams.json
      - path: WebContent/data/hexagrams.en.json
    dependencies:
      - package: OracleKit
      - target: YijingWatchWidgets   # embed the complication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.codeberg.jkaindl.Yijing.watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/Yijing.watch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"

  # watchOS complication (daily hexagram on Apple's faces). Bundles only the slim
  # slice; uses OracleKit.SlimData + the shared WatchHexFigure.
  YijingWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Shared/BrandColors.swift
      - path: WatchWidgets/ComplicationWidget.swift
      - path: Watch/WatchHexFigure.swift
      - path: WatchWidgets/PrivacyInfo.xcprivacy
      - path: WebContent/data/widget-hexagrams.json
    dependencies:
      - package: OracleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.codeberg.jkaindl.Yijing.watchkitapp.widgets
        INFOPLIST_FILE: WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/Yijing.watchwidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"

packages:
  OracleKit:
    path: OracleKit
  # llama:
  #   url: https://github.com/ggml-org/llama.cpp
  #   exactVersion: "bXXXX"
