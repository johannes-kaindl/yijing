name: Feature request
about: An idea for an improvement or a new feature
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Before you type — Yijing is deliberately **lean** and has clear
        guardrails (see [`AGENTS.md`](https://codeberg.org/jkaindl/Yijing/src/branch/main/AGENTS.md)):

        - **no** framework (React/Vue/Svelte)
        - **no** build step (Webpack/Vite/esbuild)
        - **no** TypeScript
        - **no** backend service
        - **no** cloud LLM connection as the default

        If your proposal needs one of these, it will probably be declined
        — but please open it honestly anyway, and we'll talk it over.
  - type: textarea
    id: problem
    attributes:
      label: Which problem does the feature solve?
      description: What doesn't work today, or is cumbersome?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you implement it? UI sketch, JSON example, pseudocode — whatever helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Which other approaches did you consider?
  - type: dropdown
    id: scope
    attributes:
      label: What is affected?
      multiple: true
      options:
        - Web UI (HTML/CSS)
        - JS logic (app.js)
        - LLM adapter (llm.js)
        - Markdown renderer
        - Data (hexagrams.json / trigrams.json)
        - Build script (build_data.py)
        - iOS / iPadOS app (Swift / WKWebView shell)
        - Widgets / Watch / complication (OracleKit)
        - macOS app (Swift)
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched [existing issues](https://codeberg.org/jkaindl/Yijing/issues) for duplicates.
          required: true
        - label: I understand that the architectural guardrails from AGENTS.md apply.
          required: true
