name: Bug-Report
about: Etwas funktioniert nicht wie erwartet
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden. Bitte halte den Report so konkret wie möglich —
        je besser ich es reproduzieren kann, desto schneller geht der Fix.

        **Sicherheitsrelevante Probleme** bitte nicht hier — siehe
        [`SECURITY.md`](https://codeberg.org/jkaindl/Yijing/src/branch/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert?
      description: Eine kurze, präzise Beschreibung des Problems.
      placeholder: Klick auf „Interpretieren" zeigt keine Antwort, aber auch keine Fehlermeldung.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduktion
      description: Welche Schritte führen zuverlässig zum Fehler?
      placeholder: |
        1. App geöffnet auf https://jkaindl.codeberg.page/Yijing/
        2. Frage eingetippt, „Münzen werfen" geklickt
        3. „Interpretieren" geklickt
        4. Nichts passiert, Browser-Konsole zeigt: …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      placeholder: LLM-Antwort sollte streamend erscheinen.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Welche Oberfläche?
      options:
        - Web (Codeberg-Pages-Live-Demo)
        - Web (lokal via ./serve.sh)
        - macOS-App (Yijing.app)
        - Andere / weiß nicht
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Bei macOS-App im Menü „Über Yijing" — bei Web siehe Footer.
      placeholder: v1.1.1
  - type: input
    id: browser
    attributes:
      label: Browser / macOS-Version
      placeholder: Safari 18.5, macOS 15.4
  - type: dropdown
    id: llm-backend
    attributes:
      label: LLM-Backend (falls relevant)
      options:
        - Nicht relevant
        - Ollama
        - MLX (mlx_lm.server)
        - LM Studio
        - vLLM / OpenClaw / anderes OpenAI-kompatibles
  - type: textarea
    id: console
    attributes:
      label: Browser-Konsole / Logs
      description: Fehler aus DevTools-Konsole oder Server-Logs, falls vorhanden.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Vorab-Checks
      options:
        - label: Ich habe in [bestehenden Issues](https://codeberg.org/jkaindl/Yijing/issues) nach Duplikaten geschaut.
          required: true
        - label: Es handelt sich nicht um ein Sicherheitsproblem (sonst → SECURITY.md).
          required: true
