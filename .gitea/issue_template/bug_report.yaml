name: Bug report
about: Something isn't working as expected
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please keep the report as concrete as possible —
        the better I can reproduce it, the faster the fix.

        **Security-relevant problems** do not belong here — see
        [`SECURITY.md`](https://codeberg.org/jkaindl/Yijing/src/branch/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short, precise description of the problem.
      placeholder: Clicking "Interpret" shows no answer, but also no error message.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Which steps reliably trigger the bug?
      placeholder: |
        1. Opened the app at https://jkaindl.codeberg.page/Yijing/
        2. Typed a question, clicked "Cast coins"
        3. Clicked "Interpret"
        4. Nothing happens, the browser console shows: …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The LLM answer should appear, streaming.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - Web (Codeberg Pages live demo)
        - Web (local via ./serve.sh)
        - iOS / iPadOS app (App Store)
        - Apple Watch app
        - macOS app (Yijing.app)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: For the App Store app, Settings → About; for the macOS DMG, the "About Yijing" menu; for web, see the footer.
      placeholder: v1.0.0 (build 5) / v1.5.0 / web
  - type: input
    id: browser
    attributes:
      label: Browser / macOS version
      placeholder: Safari 18.5, macOS 15.4
  - type: dropdown
    id: llm-backend
    attributes:
      label: LLM backend (if relevant)
      options:
        - Not relevant
        - Ollama
        - MLX (mlx_lm.server)
        - LM Studio
        - vLLM / OpenClaw / other OpenAI-compatible
  - type: textarea
    id: console
    attributes:
      label: Browser console / logs
      description: Errors from the DevTools console or server logs, if available.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched [existing issues](https://codeberg.org/jkaindl/Yijing/issues) for duplicates.
          required: true
        - label: This is not a security issue (otherwise → SECURITY.md).
          required: true
