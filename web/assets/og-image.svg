<!-- Yijing Orakel social preview (1200x630). Hexagram 1 + 易經. -->
<!-- Colors mirror the app dark theme (bg, accent, accent-soft). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Yijing Orakel — I Ging mit Wilhelm-Übersetzung">
  <title>Yijing Orakel</title>
  <desc>Stilisiertes Hexagramm Nr. 1 (Das Schöpferische) mit dem chinesischen Schriftzeichen 易經 (Yijing) auf dunklem Hintergrund.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#221f1a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a30"/>
      <stop offset="50%" stop-color="#c79a4a"/>
      <stop offset="100%" stop-color="#8a6a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c79a4a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c79a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle warm glow behind the hexagram -->
  <ellipse cx="600" cy="345" rx="500" ry="240" fill="url(#glow)"/>

  <!-- 易經 — chinesisches Schriftzeichen, oben zentriert.
       Font-Fallback-Kette deckt macOS/Windows/Linux ab. -->
  <text x="600" y="160"
        text-anchor="middle"
        font-family="'Songti SC','SimSun','Noto Serif CJK SC','Source Han Serif SC','Hiragino Mincho ProN',serif"
        font-size="120"
        font-weight="500"
        fill="#c79a4a"
        letter-spacing="32">易經</text>

  <!-- Hexagramm 1 — Das Schöpferische: sechs ungebrochene Yang-Linien.
       Linien-Layout: x=440..760 (320px breit), je 14px hoch, 18px Abstand.
       Gesamt-Stack: 6*14 + 5*18 = 174px hoch, zentriert um y=345. -->
  <g>
    <rect x="440" y="220" width="320" height="14" rx="2" fill="url(#line)"/>
    <rect x="440" y="252" width="320" height="14" rx="2" fill="url(#line)"/>
    <rect x="440" y="284" width="320" height="14" rx="2" fill="url(#line)"/>
    <rect x="440" y="316" width="320" height="14" rx="2" fill="url(#line)"/>
    <rect x="440" y="348" width="320" height="14" rx="2" fill="url(#line)"/>
    <rect x="440" y="380" width="320" height="14" rx="2" fill="url(#line)"/>
  </g>

  <!-- Titel + Tagline, unten zentriert -->
  <text x="600" y="478"
        text-anchor="middle"
        font-family="'Cormorant Garamond','EB Garamond',Georgia,serif"
        font-size="56"
        font-weight="500"
        fill="#f4efe4"
        letter-spacing="2">Yijing Orakel</text>

  <text x="600" y="528"
        text-anchor="middle"
        font-family="'Cormorant Garamond','EB Garamond',Georgia,serif"
        font-size="28"
        font-style="italic"
        fill="#c79a4a"
        opacity="0.85">Drei-Münzen-Methode · Wilhelm-Übersetzung · lokale Modelle</text>

  <!-- URL, ganz dezent unten -->
  <text x="600" y="595"
        text-anchor="middle"
        font-family="'SF Mono','Fira Code','Cascadia Code',Menlo,Consolas,monospace"
        font-size="18"
        fill="#8a6a30"
        letter-spacing="2"
        opacity="0.7">pages.jkaindl.de/yijing</text>
</svg>
